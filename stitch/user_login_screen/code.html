<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Resident &amp; Staff Portal - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#136dec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101822",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .bg-gradient-soft {
            background: radial-gradient(circle at top right, #f0f4ff, #f6f7f8);
        }
        .dark .bg-gradient-soft {
            background: radial-gradient(circle at top right, #1a2332, #101822);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-[#111418] dark:text-gray-100 min-h-screen flex items-center justify-center p-4 bg-gradient-soft">
<div class="w-full max-w-[480px] animate-fade-in">
<!-- Main Card -->
<div class="bg-white dark:bg-[#1c2632] rounded-xl shadow-xl overflow-hidden border border-gray-100 dark:border-gray-800">
<!-- Logo & Header Section -->
<div class="pt-10 pb-6 px-10 text-center">
<div class="flex justify-center mb-6">
<div class="p-3 bg-primary/10 rounded-xl">
<svg class="size-10 text-primary" fill="none" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M24 45.8096C19.6865 45.8096 15.4698 44.5305 11.8832 42.134C8.29667 39.7376 5.50128 36.3314 3.85056 32.3462C2.19985 28.361 1.76794 23.9758 2.60947 19.7452C3.451 15.5145 5.52816 11.6284 8.57829 8.5783C11.6284 5.52817 15.5145 3.45101 19.7452 2.60948C23.9758 1.76795 28.361 2.19986 32.3462 3.85057C36.3314 5.50129 39.7376 8.29668 42.134 11.8833C44.5305 15.4698 45.8096 19.6865 45.8096 24L24 24L24 45.8096Z" fill="currentColor"></path>
</svg>
</div>
</div>
<h1 class="text-[#111418] dark:text-white text-3xl font-bold leading-tight tracking-tight">Welcome Back</h1>
<p class="text-gray-500 dark:text-gray-400 text-base mt-2">Manage your residential fees and account.</p>
</div>
<!-- Login Form -->
<div class="px-10 pb-10">
<form class="space-y-5" onsubmit="return false;">
<!-- Email Input -->
<div class="space-y-2">
<label class="text-sm font-semibold text-gray-700 dark:text-gray-300 ml-1">Email Address</label>
<div class="relative">
<input class="w-full h-12 px-4 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#101822] text-[#111418] dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-gray-400" placeholder="name@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="text-sm font-semibold text-gray-700 dark:text-gray-300">Password</label>
<a class="text-xs font-bold text-primary hover:underline" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<input class="w-full h-12 pl-4 pr-12 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#101822] text-[#111418] dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all placeholder:text-gray-400" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center px-1">
<input class="size-4 text-primary border-gray-300 dark:border-gray-700 rounded focus:ring-primary bg-white dark:bg-[#101822]" id="remember" type="checkbox"/>
<label class="ml-2 text-sm text-gray-600 dark:text-gray-400 cursor-pointer" for="remember">Keep me logged in</label>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary hover:bg-primary/90 text-white font-bold rounded-lg transition-all shadow-md active:scale-[0.98]">
                        Sign In
                    </button>
<!-- Divider -->
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-100 dark:border-gray-800"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-white dark:bg-[#1c2632] px-2 text-gray-400">Or continue with</span>
</div>
</div>
<!-- Social Login -->
<button class="w-full h-12 flex items-center justify-center gap-3 bg-white dark:bg-[#101822] border border-gray-200 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 text-gray-700 dark:text-gray-200 font-semibold rounded-lg transition-all">
<svg class="size-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                        Sign in with Google
                    </button>
</form>
</div>
</div>
<!-- Footer Link -->
<p class="text-center mt-8 text-sm text-gray-500 dark:text-gray-400">
            Don't have an account yet? 
            <a class="font-bold text-primary hover:underline ml-1" href="#">Request Access / Register</a>
</p>
<!-- Bottom Help Link -->
<div class="mt-12 flex justify-center">
<button class="flex items-center gap-2 text-xs font-medium text-gray-400 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[16px]">help</span>
                Need technical assistance?
            </button>
</div>
</div>
<!-- Background Decorative Element (Optional) -->
<div class="fixed bottom-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
</body></html>
